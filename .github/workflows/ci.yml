name: CI

on:
  push:
    branches:
      - main
      - phase/**
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tqm
          POSTGRES_PASSWORD: tqm
          POSTGRES_DB: tqm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tqm -d tqm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tqm:tqm@localhost:5432/tqm
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: End-to-end tests
        run: pnpm --filter @task-queue-mini/api test:e2e
